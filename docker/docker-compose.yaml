# BibitLive — processing layer + service listener.
#
# Satu image monitoring-service dijalankan sebagai TUJUH proses berbeda, dipilih
# lewat ROLE. Tiap role punya siklus hidup, jumlah replica, dan alasan gagalnya
# sendiri — persis seperti service terpisah. Yang dibagi hanya repositori dan
# image, bukan proses.
#
#   docker compose up -d
#   docker compose up -d --scale persistence=4 --scale processing=3
#
# JANGAN menaikkan replica collector, alert, atau scheduler. Alasannya ada di
# komentar masing-masing service.

x-monitoring-build: &monitoring-build
  build:
    context: ../services/monitoring-service

x-monitoring-env: &monitoring-env
  DB_HOST: postgres-monitoring
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: screenhouse_monitoring
  RABBITMQ_URL: amqp://screenhouse:screenhouse@rabbitmq:5672
  RABBITMQ_EXCHANGE: shms.events
  JWT_SECRET: supersecret
  # Slot `fan` gh01 = katup irigasi tray 2 (lihat CLAUDE.md). Nilainya harus
  # sama persis di SEMUA role dan di app-service.
  ACTUATOR_CAPABILITIES: 700:irrigation=Irigasi Tray 1|fan=Irigasi Tray 2
  AUTO_ACTUATOR_ENABLED: "false"
  # gh01 dikecualikan permanen: rule otomatis memetakan suhu udara tinggi → fan ON,
  # yang di gh01 berarti membuka katup air tray 2 (tray kebanjiran di hari panas).
  AUTO_ACTUATOR_EXCLUDE: "700"

x-monitoring-deps: &monitoring-deps
  postgres-monitoring:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:

  # ========================= INFRASTRUKTUR =========================

  postgres-app:
    image: postgres:16
    container_name: screenhouse-postgres-app
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: screenhouse_app
    ports:
      - "5434:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screenhouse_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-monitoring:
    image: postgres:16
    container_name: screenhouse-postgres-monitoring
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: screenhouse_monitoring
    ports:
      - "5433:5432"
    volumes:
      - postgres_monitoring_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screenhouse_monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: screenhouse-mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  # Satu-satunya bus antar service. Redis sudah dihapus dari sistem ini — di
  # kode lama ia murni message bus (klien datanya dibuat tapi tidak pernah
  # dipakai), jadi tidak ada cache atau session yang perlu dipindahkan.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: screenhouse-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: screenhouse
      RABBITMQ_DEFAULT_PASS: screenhouse
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Tanpa ini, seluruh consumer naik sebelum broker siap menerima koneksi.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ========================= JALUR TELEMETRI =========================

  # TEPAT SATU INSTANCE. Subscriber MQTT menerima SETIAP pesan pada topik yang
  # cocok — replica kedua menggandakan seluruh data sensor. Untuk lebih dari
  # satu, pakai shared subscription MQTT v5 ($share/grup/topik).
  collector:
    <<: *monitoring-build
    container_name: screenhouse-collector
    restart: unless-stopped
    environment:
      <<: *monitoring-env
      ROLE: collector
      HEALTH_PORT: 3010
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      # --- Jembatan perangkat sensor sungguhan (gh01) ---
      # Broker MQTT di luar stack ini, jadi pakai IP publik (bukan nama service
      # Docker). Skema WAJIB mqtt:// — .env host TIDAK terbaca di container
      # (.dockerignore), jadi semua env device-bridge dideklarasikan di sini.
      DEVICE_BRIDGE_URL: mqtt://168.110.214.70:1883
      DEVICE_BRIDGE_MAP: gh01:700
      DEVICE_BRIDGE_DEBUG: "true"
      # Perangkat publish QoS 0 → frame yang lewat saat bridge disconnect hilang.
      # Keepalive pendek = koneksi mati diam-diam cepat ketahuan (~1,5x nilai ini).
      DEVICE_BRIDGE_KEEPALIVE_SEC: "30"
      # Batas selisih jam perangkat vs server sebelum stempel waktu payload
      # diabaikan (created_at balik ke waktu terima). RTC gh01 pernah keset ~22 jam.
      DEVICE_MAX_CLOCK_SKEW_SEC: "900"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # Boleh ditambah replica: q.ingest antrean kerja, tiap tugas hanya sampai ke
  # satu consumer.
  processing:
    <<: *monitoring-build
    restart: unless-stopped
    environment:
      <<: *monitoring-env
      ROLE: processing
      HEALTH_PORT: 3011
    depends_on: *monitoring-deps

  # Sumbu skala utama untuk kapasitas ingest — ini yang ditambah saat menaikkan
  # throughput. Semua replica bersaing di q.persist.
  persistence:
    <<: *monitoring-build
    restart: unless-stopped
    environment:
      <<: *monitoring-env
      ROLE: persistence
      HEALTH_PORT: 3012
    depends_on: *monitoring-deps

  # TEPAT SATU INSTANCE. Histeresis membaca status alert lalu menulisnya, dan
  # cache ambangnya lokal — dua consumer paralel bisa saling mendahului.
  alert:
    <<: *monitoring-build
    container_name: screenhouse-alert
    restart: unless-stopped
    environment:
      <<: *monitoring-env
      ROLE: alert
      HEALTH_PORT: 3013
    depends_on: *monitoring-deps

  # TEPAT SATU INSTANCE. Ini penjadwal, bukan listener — dua instance berarti
  # dua pemindaian bersamaan dan alert offline ganda.
  scheduler:
    <<: *monitoring-build
    container_name: screenhouse-scheduler
    restart: unless-stopped
    environment:
      <<: *monitoring-env
      ROLE: scheduler
      HEALTH_PORT: 3014
      OFFLINE_CHECK_INTERVAL_SEC: "300"
    depends_on: *monitoring-deps

  # ========================= MENGHADAP PENGGUNA =========================

  # Boleh ditambah replica. Tiap proses membuat queue-nya sendiri yang di-bind ke
  # exchange, jadi tidak perlu adapter Socket.IO — cukup sticky session di LB.
  realtime:
    <<: *monitoring-build
    restart: unless-stopped
    ports:
      # Kemudahan pengembangan: `npm run dev` di frontend (port 5173) menyambung
      # ke sini langsung, tanpa lewat load balancer.
      #
      # PERHATIAN: port host yang tetap membuat `--scale realtime=N` gagal
      # ("port is already allocated"). Untuk menguji beberapa replica, hapus blok
      # ports ini dan akses lewat load balancer di :8082/socket.io.
      - "3002:3002"
    environment:
      <<: *monitoring-env
      ROLE: realtime
      PORT: 3002
      REALTIME_TTL_MS: "30000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  monitoring-api:
    <<: *monitoring-build
    restart: unless-stopped
    ports:
      # Dipertahankan di 3001 supaya harness uji beban dan skrip lokal yang
      # menembak localhost:3001/stats tetap jalan. Caveat --scale sama dengan
      # realtime di atas.
      - "3001:3001"
    environment:
      <<: *monitoring-env
      ROLE: api
      PORT: 3001
    depends_on: *monitoring-deps

  app-service:
    build:
      context: ../services/app-service
    restart: unless-stopped
    environment:
      ROLE: api
      PORT: 8000
      DB_HOST: postgres-app
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: screenhouse_app
      # Stats read-only ke DB monitoring (host terpisah di jaringan Docker)
      DB_MON_HOST: postgres-monitoring
      DB_MON_PORT: 5432
      DB_MON_NAME: screenhouse_monitoring
      RABBITMQ_URL: amqp://screenhouse:screenhouse@rabbitmq:5672
      RABBITMQ_EXCHANGE: shms.events
      JWT_SECRET: supersecret
      MONITORING_SERVICE_URL: http://monitoring-api:3001
      # Harus sama persis dengan role monitoring-service, supaya laporan wilayah
      # & analytics siklus tidak menghitung slot `fan` pinjaman gh01 sebagai kipas.
      ACTUATOR_CAPABILITIES: 700:irrigation=Irigasi Tray 1|fan=Irigasi Tray 2
      # Web Push. Nilainya dari `docker/.env` (lihat .env.example) — harus sama
      # persis dengan service `notifikasi`, kalau tidak browser menolak kiriman
      # dengan 403 VapidPkHashMismatch. Kosong = push nonaktif, service tetap
      # jalan normal.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@bibitlive.local}
    depends_on:
      postgres-app:
        condition: service_healthy
      postgres-monitoring:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Listener notifikasi. Tinggal di app-service karena langganan Web Push milik
  # domain identitas — tabelnya ada di database app. Tidak membuka port apa pun.
  notifikasi:
    build:
      context: ../services/app-service
    container_name: screenhouse-notifikasi
    restart: unless-stopped
    environment:
      ROLE: notifikasi
      DB_HOST: postgres-app
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: screenhouse_app
      RABBITMQ_URL: amqp://screenhouse:screenhouse@rabbitmq:5672
      RABBITMQ_EXCHANGE: shms.events
      # Sama persis dengan app-service — inilah proses yang benar-benar mengirim.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@bibitlive.local}
    depends_on:
      postgres-app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Load balancer + penyaji SPA. Menggantikan container `frontend` lama: isinya
  # sama (hasil build Vite), tapi konfigurasi nginx-nya sekarang punya pool.
  loadbalancer:
    build:
      context: ../frontend
      args:
        VITE_DEV_PROXY: "false"
        VITE_API_URL: /api
        VITE_MONITORING_URL: ""
    container_name: screenhouse-lb
    restart: unless-stopped
    ports:
      # 8080 dipakai container lain (spark-master) — pakai 8082 di host.
      - "8082:80"
    volumes:
      - ./nginx/loadbalancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-service:
        condition: service_started
      monitoring-api:
        condition: service_started
      realtime:
        condition: service_started

volumes:
  postgres_app_data:
  postgres_monitoring_data:
  rabbitmq_data:
