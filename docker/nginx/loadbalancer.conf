# Load balancer BibitLive.
#
# Dua pool di belakang satu pintu. Docker menyelesaikan nama service ke seluruh
# alamat replica-nya, jadi `server app-service:8000 resolve` sudah cukup untuk
# round-robin sederhana tanpa daftar host manual.
#
# TIDAK ADA blok untuk MQTT di sini, dan itu disengaja. Load balancer membagi
# permintaan yang MASUK; subscriber MQTT bekerja terbalik — brokerlah yang
# mendorong pesan ke setiap pelanggan, jadi dua collector di belakang LB akan
# sama-sama menerima setiap pembacaan dan setiap baris masuk dua kali. Untuk
# lebih dari satu collector, pakai shared subscription MQTT v5
# ($share/grup/topik), bukan berkas ini.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_api {
    zone app_api 64k;
    server app-service:8000 resolve;
    keepalive 32;
}

upstream monitoring_api {
    zone monitoring_api 64k;
    server monitoring-api:3001 resolve;
    keepalive 32;
}

upstream realtime_gateway {
    zone realtime_gateway 64k;

    # Socket.IO menyimpan status handshake di memori proses. Tanpa sticky, satu
    # klien bisa mendarat di replica berbeda saat polling dan handshake-nya tidak
    # dikenali ("Session ID unknown"). ip_hash mengunci klien ke satu replica.
    #
    # Alternatif yang lebih bersih kalau semua klien mendukungnya: paksa
    # transports: ["websocket"] di frontend, lalu sticky tidak diperlukan lagi
    # karena koneksinya satu dan panjang, bukan rangkaian request pendek.
    ip_hash;
    server realtime:3002 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST → app-service. Prefix /api dibuang agar cocok dengan route backend.
    location /api/ {
        proxy_pass http://app_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statistik & data sensor langsung ke monitoring-service (tanpa lewat proxy
    # app-service) untuk laporan dan pemantauan uji beban.
    location /monitoring/ {
        proxy_pass http://monitoring_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO → gateway realtime.
    location /socket.io/ {
        proxy_pass http://realtime_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket menganggur di antara pembacaan sensor. Timeout default 60s
        # akan memutus koneksi petani yang sedang membuka dashboard diam-diam.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback — semua route non-file diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
