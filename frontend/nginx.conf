server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST → app-service. Prefix /api dibuang agar cocok dengan route backend
    # (mirror rewrite proxy Vite di dev).
    location /api/ {
        proxy_pass http://app-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO → monitoring-service (WebSocket same-origin).
    location /socket.io/ {
        proxy_pass http://monitoring-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — semua route non-file diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
