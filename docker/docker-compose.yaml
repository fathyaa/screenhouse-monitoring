services:

  postgres-app:
    image: postgres:16
    container_name: screenhouse-postgres-app
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: screenhouse_app
    ports:
      - "5434:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data

  postgres-monitoring:
    image: postgres:16
    container_name: screenhouse-postgres-monitoring
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: screenhouse_monitoring
    ports:
      - "5433:5432"
    volumes:
      - postgres_monitoring_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: screenhouse-redis
    restart: always
    ports:
      - "6379:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: screenhouse-mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  # RabbitMQ ingest buffer (opsional — aktifkan dengan USE_RABBITMQ=true)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: screenhouse-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: screenhouse
      RABBITMQ_DEFAULT_PASS: screenhouse

  # Final project: LB HTTP untuk 2× monitoring-service (uji S2/S4)
  # MQTT load test tetap ke :1883 — tidak lewat Nginx
  nginx-lb:
    image: nginx:alpine
    container_name: screenhouse-nginx-lb
    restart: unless-stopped
    ports:
      - "3080:80"
    volumes:
      - ./nginx/stress-lb.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_app_data:
  postgres_monitoring_data:
