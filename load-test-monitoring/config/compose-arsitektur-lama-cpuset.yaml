# Batas resource untuk seri uji beban ARSITEKTUR LAMA (branch main).
#
# Dipakai bertumpuk di atas docker-compose.yaml milik main:
#   docker compose -f docker-compose.yaml -f <file ini> up -d
# Lihat scripts/jalankan-seri-arsitektur-lama.sh.
#
# KENAPA FILE INI ADA DI SINI, BUKAN DI main
#
# `main` sama sekali tidak menyimpan docker-compose.prod-sim.yaml — file itu
# dulu hanya ada sebagai berkas lokal tak terlacak. Konsekuensinya konfigurasi
# resource run 4 Agustus 2026 memang tidak bisa direkonstruksi dari repositori,
# dan itulah alasan seluruh seri lama harus dijalankan ulang alih-alih dikutip.
#
# Karena file pembatas untuk arsitektur lama harus dibuat baru, ia dibuat
# SEBANGUN dengan prod-sim arsitektur baru — alokasi core dan anggaran memori
# identik — supaya satu-satunya perbedaan antar seri adalah arsitekturnya.
#
# ALOKASI (identik dengan docker/docker-compose.prod-sim.yaml di branch redesign)
#
#   core 0  seluruh proses pipeline monitoring          8 GB
#           lama: monitoring-service (satu proses)
#           baru: tujuh role berbagi core yang sama
#   core 1  postgres-monitoring                          4 GB
#   core 2  postgres-app + app-service                   6 GB + 2 GB
#   core 3  mosquitto                                    4 GB
#   core 4  broker pesan (rabbitmq, dan redis di lama)   4 GB + 2 GB
#   core 5  frontend                                   512 MB
#   core 6-7 dibiarkan bebas untuk simulator & proses host
#
# `cpus:` sengaja TIDAK dipakai. Plafon waktu CPU per container membebani
# arsitektur baru secara tidak adil: tujuh proses masing-masing berplafon kecil
# tidak bisa saling meminjam kapasitas, sedangkan satu proses berplafon 1 CPU
# bisa memakai seluruhnya. cpuset menyamakan mekanismenya — keduanya mendapat
# tepat satu core dan penjadwal kernel yang membagi di dalamnya.

services:
  monitoring-service:
    cpuset: "0"
    deploy:
      resources:
        limits:
          memory: 8G

  postgres-monitoring:
    cpuset: "1"
    deploy:
      resources:
        limits:
          memory: 4G

  postgres-app:
    cpuset: "2"
    deploy:
      resources:
        limits:
          memory: 6G

  app-service:
    cpuset: "2"
    deploy:
      resources:
        limits:
          memory: 2G

  mosquitto:
    cpuset: "3"
    deploy:
      resources:
        limits:
          memory: 4G

  rabbitmq:
    cpuset: "4"
    deploy:
      resources:
        limits:
          memory: 4G

  # Arsitektur lama memakai Redis sebagai message bus. Ia menumpang core broker,
  # sepadan dengan RabbitMQ di arsitektur baru.
  redis:
    cpuset: "4"
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    cpuset: "5"
    deploy:
      resources:
        limits:
          memory: 512M
